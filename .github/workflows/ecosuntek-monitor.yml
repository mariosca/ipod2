# Scarica le quotazioni di Ecosuntek ogni ora nei giorni di Borsa, le salva nel
# repository e pubblica l'app su GitHub Pages (solo dal branch predefinito).
name: Ecosuntek Monitor

on:
  schedule:
    - cron: "15 7-17 * * 1-5"   # ogni ora dalle 9:15 alle 19:15 ora italiana (UTC+2), lun-ven
  workflow_dispatch:
  push:
    paths:
      - "ecosuntek-monitor/**"
      - ".github/workflows/ecosuntek-monitor.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ecosuntek-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dati:
    name: Aggiorna quotazioni
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Scarica da Yahoo Finance
        run: python3 ecosuntek-monitor/fetch_data.py ECK.MI
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecosuntek-monitor/data/
          if git diff --cached --quiet; then
            echo "Nessuna variazione"
          else
            git commit -m "Aggiorna quotazioni Ecosuntek ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi

  pages:
    name: Pubblica su GitHub Pages
    needs: dati
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
